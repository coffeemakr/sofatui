name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and smoke test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run from the locked project environment
        run: uv run --locked sofatui --version
      - name: Check that the pyatv patches still apply
        run: uv run --locked python -c "from sofatui import pyatv_patches; pyatv_patches.apply()"
      - name: Build and run the wheel
        run: |
          uv build
          uvx --from dist/*.whl sofatui --version
